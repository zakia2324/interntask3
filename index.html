<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Digital Business Card</title>
</head>
<body>
  <div class="dark-mode-toggle">
    <button id="dark-mode-btn">Toggle Dark Mode</button>
  </div>
  <div class="business-card ">
    <!-- Front Side -->
    <div class="card-front">
      <img src="girlpic.jpg" alt="Profile Picture" height="150" width="200" class="profile-picture" />
      <h1>Zakia Ali</h1>
      <h2>Frontend Intern</h2>
      <p>"digital magic one line of code at a time."</p>
      <button id="flip-card-btn">Flip Card</button>
    </div>

    <!-- Back Side -->
    <div class="card-back">
      <p>Short bio or about me.</p>
      <div class="social-links">
        <a href="https://github.com/zakia2324" target="_blank">GitHub</a>
        <a href="https://linkedin.com/in/zakia-ali-8bb40a27a" target="_blank">LinkedIn</a>
        <a href="#">Portfolio</a>
      </div>
      <button id="message-btn">Send Message</button>
      <button id="back-card-btn">Back Card</button>

    </div>
    
  </div>

  <!-- Modal Popup -->
  <div id="modal" class="hidden">
    <form id="contact-form">
      <input type="text" placeholder="Your Name" id="name" required />
      <input type="email" placeholder="Your Email" id="email" required />
      <textarea placeholder="Your Message" id="message" required></textarea>
      <button type="submit">Submit</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
